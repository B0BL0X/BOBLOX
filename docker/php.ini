; BOBLOX PHP settings (on top of php.ini-production)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 8M
max_execution_time = 30
date.timezone = UTC

; Keep logins across container restarts and rebuilds
session.save_path = "/var/www/html/App_Data/sessions"
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 604800
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 0
